<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- classification: {{CLASSIFICATION}} -->
<title>{{TITLE}} · </title>
<style>
/* Document Design System v1 — generated by tools/docgen (source: docs/design/DOC_DESIGN_SYSTEM.md)
   B&W base + accent signal color. Color is an event, never decoration. */
:root{
  --paper:#ffffff; --ink:#0a0a0a;
  --g1:#f4f4f4; --g2:#e6e6e6; --g3:#cfcfcf; --g4:#9a9a9a; --g5:#5e5e5e;
  --line:#111;
  --accent:#1E3A6E; --accent-hi:#4A7FC1; --accent-dim:#0F2040;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:var(--mono)}
.wrap{max-width:980px;margin:0 auto;padding:0 24px;min-width:0}

/* ---- containment: no text ever escapes its box ---- */
h1,h2,h3,h4,p,li,td,th,dt,dd,summary,figcaption,.lead,.kicker,.badge,.figcap,.note,.stat .l{overflow-wrap:break-word;word-break:break-word}
a,code{overflow-wrap:anywhere}
td code,li code,p code{white-space:normal}
.page>*,.row>*,.statgrid>*,main,section.doc .wrap{min-width:0}
img,svg,video{max-width:100%;height:auto}

/* ---- hero ---- */
header.hero{border-bottom:2px solid var(--line);padding:64px 0 40px;position:relative;background:
  radial-gradient(ellipse at 30% 0,rgba(0,0,0,0) 40%,var(--paper) 75%),
  repeating-linear-gradient(0deg,transparent,transparent 33px,var(--g2) 34px),
  repeating-linear-gradient(90deg,transparent,transparent 33px,var(--g2) 34px)}
header.hero::after{content:"";position:absolute;left:0;bottom:-2px;width:120px;height:2px;background:var(--accent)}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--g5)}
.kicker::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:10px;transform:rotate(45deg);vertical-align:1px}
h1{font-size:clamp(34px,6vw,62px);font-weight:700;letter-spacing:-.02em;line-height:1.06;margin:14px 0 12px;text-wrap:balance}
.lead{font-size:clamp(17px,2.2vw,21px);color:var(--g5);max-width:44em}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.badge{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--ink);border-radius:2px;padding:4px 9px}
.badge.fill{background:var(--ink);color:var(--paper)}

/* ---- layout: sticky TOC + column ---- */
.page{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding:0 24px}
nav.toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:28px 0;
  font-family:var(--mono);font-size:12px;background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(6px)}
nav.toc a{display:block;color:var(--g5);text-decoration:none;padding:5px 10px;border-left:1px solid var(--g2);overflow-wrap:anywhere}
nav.toc a:hover{color:var(--ink);border-left-color:var(--ink)}
nav.toc a.active{color:var(--accent-hi);border-left-color:var(--accent-hi)}
nav.toc .toc-h{letter-spacing:.18em;text-transform:uppercase;color:var(--g4);padding:0 10px 8px}
main{max-width:980px;min-width:0}
@media (max-width:900px){.page{display:block}nav.toc{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:2px;padding:16px 0;border-bottom:1px solid var(--g2)}nav.toc .toc-h{width:100%}}

/* ---- sections ---- */
section.doc{padding:70px 0;border-bottom:1px solid var(--g2)}
section.doc:last-of-type{border-bottom:none}
.secnum{font-family:var(--mono);display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1.5px solid var(--g3);border-radius:50%;font-size:13px;margin-bottom:14px}
h2{font-size:clamp(24px,3.6vw,38px);font-weight:700;letter-spacing:-.02em;margin-bottom:12px;text-wrap:balance}
h3{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:28px 0 10px}
h4{font-family:var(--mono);font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--g5);margin:24px 0 8px}
p{max-width:46em}p+p{margin-top:10px}
ul,ol{padding-left:1.4em;max-width:46em;margin:10px 0}
li{margin:4px 0}
a{color:var(--accent-hi)}
strong{font-weight:700}
hr{border:none;border-top:1px solid var(--g2);margin:32px 0}

/* ---- code ---- */
code{font-family:var(--mono);font-size:.86em;background:var(--g1);border:1px solid var(--g2);border-radius:2px;padding:1px 5px}
pre{background:var(--g1);border:1px solid var(--g2);border-radius:4px;padding:16px;overflow-x:auto;margin:16px 0}
pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.5}

/* ---- tables ---- */
.tblwrap{overflow-x:auto;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;text-align:left;padding:8px 10px}
td{padding:7px 10px;border-bottom:1px solid var(--g2);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--g1)}
td code{white-space:nowrap}

/* ---- components ---- */
.note{border-left:4px solid var(--ink);background:var(--g1);padding:14px 18px;margin:20px 0;max-width:none}
.note.brand{border-left-color:var(--accent)}
.note .lab{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--g5);display:block;margin-bottom:6px}
.note p{max-width:none}
.card{border:1.5px solid var(--ink);border-radius:4px;padding:20px}
.card.soft{border:1px solid var(--g3)}
.row{display:grid;gap:14px;margin:18px 0}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:760px){.row.c2,.row.c3{grid-template-columns:1fr}}
.tag{font-family:var(--mono);font-size:11px;border:1px solid var(--g3);border-radius:2px;padding:2px 8px;color:var(--g5);display:inline-block;margin:2px 2px 2px 0}
ol.steps{list-style:none;counter-reset:step;padding:0;max-width:none}
ol.steps>li{counter-increment:step;position:relative;padding:0 0 18px 58px;margin:0}
ol.steps>li::before{content:counter(step,decimal-leading-zero);font-family:var(--mono);font-size:13px;position:absolute;left:0;top:0;width:40px;height:40px;border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center}
ol.steps .io{font-family:var(--mono);font-size:11.5px;color:var(--g5);display:block;margin-top:3px}
.svgwrap{border:1px solid var(--g3);border-radius:4px;padding:18px;margin:20px 0;background:repeating-linear-gradient(0deg,#fff,#fff 27px,var(--g1) 28px)}
.svgwrap svg{width:100%;height:auto;display:block}
.figcap{font-family:var(--mono);font-size:11.5px;color:var(--g5);text-align:center;margin-top:10px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.stat{border:1.5px solid var(--ink);border-radius:4px;padding:16px}
.stat.soft{border-color:var(--g3);border-width:1px}
.stat.acc{border-color:var(--accent)}
.stat.acc .n{color:var(--accent)}
.stat .n{font-family:var(--mono);font-size:clamp(19px,4.6vw,30px);font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .l{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--g5);margin-top:4px}

/* ---- reveal (guarded) ---- */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ---- footer / changelog ---- */
footer.doc{padding:40px 0 70px;color:var(--g5);font-size:13px;font-family:var(--mono)}
@media print{nav.toc{display:none}.page{display:block}header.hero{padding:24px 0}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <span class="kicker">{{KICKER}}</span>
  <h1>{{TITLE}}</h1>
  <p class="lead">{{LEAD}}</p>
  <div class="badges">{{BADGES}}</div>
</div></header>
<div class="page">
<nav class="toc" aria-label="Table of contents"><div class="toc-h">Contents</div>
{{TOC}}
</nav>
<main>
{{CONTENT}}
</main>
</div>
<footer class="doc"><div class="wrap">{{FOOTER}}</div></footer>
<script>
(function(){
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var els=[].slice.call(document.querySelectorAll('section.doc'));
    els.forEach(function(el,i){if(i<6)el.classList.add('reveal')});
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}})},{threshold:.05});
    els.forEach(function(el){io.observe(el)});
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in')});
  }
  var links=[].slice.call(document.querySelectorAll('nav.toc a'));
  var secs=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1))}).filter(Boolean);
  if(secs.length){
    var spy=new IntersectionObserver(function(es){es.forEach(function(en){
      if(en.isIntersecting){links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id)})}
    })},{rootMargin:'-20% 0px -70% 0px'});
    secs.forEach(function(s){spy.observe(s)});
  }
})();
</script>
</body>
</html>
