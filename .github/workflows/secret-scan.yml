# The server-side half of the git moat (OG-31). No client-side hook can defend against
# `git push --no-verify`: git skips the hook before it runs. This job is the check a branch ruleset
# requires before a pull request may merge, so a secret cannot reach `master` even when every local
# hook was bypassed — the one place the moat can actually close.
#
# ci-cost-control (`~/.claude/rules/ci-cost-control.md`): PR-triggered only, never on `push` (rule 2);
# GitHub-HOSTED, never the shared VPS2 self-hosted runner (§9.1 — a required check whose runner label
# nobody serves queues forever as `pending` and blocks every merge silently; §9.2 — gitleaks stays
# GitHub-hosted and un-draft-guarded, always); least-privilege token; `concurrency` + `timeout`;
# actions and the scanner pinned by SHA. A fork/Dependabot PR runs no package-authored code here
# (gitleaks only reads git history), and the `if:` keeps it to same-repo PRs for parity with §9.2.
#
# The bound this does NOT close, stated because THREAT_MODEL.md must (OG-214/OG-193): this gates the
# MERGE path to `master`. On a private repo without GitHub Advanced Security there is no push-time
# content scan, so a secret force-pushed to a throwaway FEATURE branch still reaches origin until this
# check flags its PR. What is closed server-side: a `--no-verify` push to the protected branch is
# refused by the ruleset, and a secret in a PR cannot be merged.
name: secret-scan
on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version + checksum)
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the full history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
